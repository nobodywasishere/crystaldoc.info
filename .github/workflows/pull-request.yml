name: Crystal PR test

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    container:
      image: crystallang/crystal

    steps:
    - uses: actions/checkout@v3
    - name: Install apt dependencies
      run: |
        apt update -y
        apt install -y g++ cmake wget libapparmor-dev fossil
    - uses: robinraju/release-downloader@v1.8
      id: dl_fj
      with:
        repository: "netblue30/firejail"
        latest: true
        fileName: "*amd64.deb"
    - name: Install firejail
      run: apt install -y "${{ fromJson(steps.dl_fj.outputs.downloaded_files)[0] }}"
    - name: Shards install
      env:
        # Lexbor 3.1.3's pinned C source still declares CMake 2.8 compatibility.
        CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      run: |
        shards install
        test -s lib/lexbor/src/ext/lexbor-c/build/liblexbor_static.a
    - name: Run tests
      run: LOG_LEVEL=error crystal spec -Dwithout_mt
